<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>Welcome Email</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 8px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { font-size: 22px; font-weight: bold; color: #333333; margin-bottom: 20px; }
        .highlight-box { background-color: #f0f0f0; border-left: 4px solid #5cb85c; padding: 16px 20px; border-radius: 4px; margin: 24px 0; }
        .highlight-box span { font-size: 16px; font-weight: bold; color: #333333; }
        .warning { font-size: 13px; color: #888888; margin-top: 24px; }
        .footer { margin-top: 32px; font-size: 12px; color: #aaaaaa; border-top: 1px solid #eeeeee; padding-top: 16px; }
    </style>
</head>
<body>
<div class="container">

    <div class="header">Welcome aboard! 🎉</div>

    <p>Hi <strong th:text="${recipientName}"></strong>,</p>
    <p>Your account has been successfully created. Here are your account details:</p>

    <div class="highlight-box">
        <span>Username: </span>
        <span th:text="${username}"></span>
    </div>

    <p th:text="${body}"></p>

    <p class="warning">If you didn't create this account, please contact our support team immediately.</p>

    <div class="footer">
        This is an automated message, please do not reply.<br/>
        &copy; Cires Technology
    </div>

</div>
</body>
</html>
