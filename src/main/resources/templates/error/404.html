<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>404 - Page Not Found</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 600px; width: 90%; background-color: #ffffff; border-radius: 8px; padding: 60px 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .error-code { font-size: 96px; font-weight: bold; color: #eeeeee; line-height: 1; }
        .accent-bar { width: 60px; height: 4px; background-color: #d9534f; margin: 16px auto; border-radius: 2px; }
        .title { font-size: 22px; font-weight: bold; color: #333333; margin-bottom: 12px; }
        .message { font-size: 15px; color: #888888; line-height: 1.6; margin-bottom: 32px; }
        .highlight-box { background-color: #f0f0f0; border-left: 4px solid #d9534f; padding: 16px 20px; border-radius: 4px; margin: 0 auto 32px; text-align: left; font-size: 13px; color: #555555; }
        .highlight-box span { font-weight: bold; color: #d9534f; }
        .btn { display: inline-block; padding: 12px 28px; background-color: #d9534f; color: #ffffff; border-radius: 4px; text-decoration: none; font-size: 14px; font-weight: bold; transition: background-color 0.2s; }
        .btn:hover { background-color: #c9302c; }
        .footer { margin-top: 40px; font-size: 12px; color: #aaaaaa; border-top: 1px solid #eeeeee; padding-top: 16px; }
    </style>
</head>
<body>
<div class="container">

    <div class="error-code">404</div>
    <div class="accent-bar"></div>

    <div class="title">Page Not Found</div>
    <p class="message">
        The page you're looking for doesn't exist or has been moved.<br/>
        Please check the URL or head back to the homepage.
    </p>

    <a href="/" class="btn">Back to Home</a>

    <div class="footer">
        If you believe this is a mistake, please contact support.<br/>
        &copy; Cires Technology
    </div>

</div>
</body>
</html>
