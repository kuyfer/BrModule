version: '3.8'

services:
  db:
    image: postgres:15
    container_name: my-postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser

    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: my-adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres-data: