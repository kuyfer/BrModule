version: '3.8'

services:
  db:
    image: postgres:15
    container_name: my-postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser

    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: my-adminer
    restart: always
    ports:
      - "8080:8080"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbit
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres-data:
  rabbitmq-data: